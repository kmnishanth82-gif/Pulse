<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>V-STAR PPMS</title>
<style>
:root{--bg:#f3f5f8;--cd:#fff;--tx:#1b2430;--mu:#667085;--bd:#dde2ea;--pr:#0b4f8a;--ok:#1a8f4c;--am:#d98a00;--rd:#c8352b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--cd:#18212f;--tx:#e8edf5;--mu:#97a3b6;--bd:#2a3649;--pr:#5aa7ee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding-bottom:60px}
header{background:#14213a;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px))}header b{font-size:14px}header small{color:#9fb0cc;display:block;font-size:11px}
.tabs{display:flex;overflow-x:auto;background:var(--cd);border-bottom:1px solid var(--bd)}.tabs a{padding:11px 14px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;color:var(--mu)}.tabs a.on{color:var(--pr);border-color:var(--pr);font-weight:600}
main{padding:12px;max-width:1100px;margin:auto}.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px}.k span{font-size:12px;color:var(--mu)}.k div{font-size:22px;font-weight:700}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input,select,button{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}input[type=number]{font-size:20px}
button{background:var(--pr);color:#fff;border-color:var(--pr);cursor:pointer;width:auto}button.s{background:var(--cd);color:var(--tx);border-color:var(--bd)}button.g{background:var(--ok);border-color:var(--ok)}button.r{background:var(--rd);border-color:var(--rd)}button.a{background:var(--am);border-color:var(--am)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
.b{padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff}.G{background:var(--ok)}.A{background:var(--am)}.R{background:var(--rd)}.N{background:#7b8798}
.er{color:var(--rd);margin:6px 0}.bar{height:8px;background:var(--bd);border-radius:4px;min-width:70px}.bar i{display:block;height:100%;background:var(--pr);border-radius:4px}
#login{max-width:340px;margin:12vh auto;padding:0 14px}
</style></head><body>
<header><div><b>V-STAR CREATIONS PVT. LTD.</b><small>PRODUCTION PLANNING &amp; MONITORING SYSTEM</small></div><div id="who" style="text-align:right;font-size:12px"></div></header>
<div id="app"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzuWNXzqy9qoB_KHgg_Da7Wb3Dn_KWWT_0va9DeFDktT3XqewcTBCNdnroVW1CoIXKk/exec"; // see README step 4
const $=s=>document.querySelector(s),T=new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5),pct=(a,b)=>b?Math.round(a/b*100):0;
let S={tok:localStorage.getItem("tok"),me:null,O:[],E:[],view:"",msg:""};try{S.me=JSON.parse(localStorage.getItem("me")||"null")}catch(e){}
async function call(a,p={}){const r=await fetch(API,{method:"POST",body:JSON.stringify({action:a,token:S.tok,...p})}),j=await r.json();if(j.error==="AUTH"){logout();throw Error("Session expired – sign in again")}if(j.error)throw Error(j.error);return j}
function logout(){localStorage.removeItem("tok");localStorage.removeItem("me");S.tok=null;S.me=null;boot()}
const MENU={planning:[["dash","Dashboard"],["orders","Orders"],["verify","Verification"],["wip","WIP"],["deliv","Delivery"]],inhouse:[["entry","Daily Entry"],["orders","My Orders"],["wip","WIP"]],jobwork:[["entry","Daily Entry"],["orders","My Orders"],["wip","WIP"]],management:[["dash","Dashboard"],["wip","WIP"],["deliv","Delivery"]]};
const cum=(id,f,st)=>S.E.filter(e=>e.OrderID==id&&(st||["Approved"]).includes(e.Status)).reduce((s,e)=>s+(+e[f]||0),0);
const bd=(t,c)=>`<span class="b ${c}">${esc(t)}</span>`;
const SC={Approved:"G",Pending:"A",Rejected:"R",Correction:"R"};
function dstat(o){const s=cum(o.id,"Sew");if(o.delivered)return["Delivered","G"];if(o.target&&o.target<T)return["Overdue","R"];if(o.target==T)return["Due Today","A"];if(o.re&&(o.re>o.target&&o.target||(o.re<T&&s<o.qty)))return["At Production Risk","R"];if(o.target&&diff(o.target,T)<=7)return["Due Within 7 Days","A"];return["Upcoming","G"]}
function pstat(o){const s=cum(o.id,"Sew");if(s>=o.qty)return["Completed","G"];if(!o.as&&o.ps&&o.ps<T)return["Start overdue","R"];if(!o.as)return["Not started","N"];if(o.re&&o.re<T)return["Beyond revised end","R"];return["Running","G"]}
function boot(){if(!S.tok){$("#who").innerHTML="";$("#app").innerHTML=`<div id="login"><div class="card"><h3>Sign in</h3><label>User ID</label><input id="u" autocapitalize="off"><br><br><label>PIN</label><input id="p" type="password" inputmode="numeric"><div class="er" id="le"></div><button onclick="login()">Sign in</button></div></div>`;return}
if(!API.startsWith("http")){$("#app").innerHTML="<main><div class='card er'>Set the API URL in index.html (README step 4).</div></main>";return}load()}
async function login(){try{const j=await call("login",{user:$("#u").value.trim(),pin:$("#p").value});S.tok=j.token;S.me=j.me;localStorage.setItem("tok",j.token);localStorage.setItem("me",JSON.stringify(j.me));S.view="";boot()}catch(e){$("#le").textContent=e.message}}
async function load(){$("#app").innerHTML="<main>Loading…</main>";try{const j=await call("data");S.O=j.orders;S.E=j.entries}catch(e){if(S.tok)$("#app").innerHTML=`<main><div class="card er">${esc(e.message)} <button class="s" onclick="load()">Retry</button></div></main>`;return}render()}
function render(){const m=MENU[S.me.role];if(!m.find(x=>x[0]==S.view))S.view=m[0][0];
$("#who").innerHTML=`${esc(S.me.name)} · ${esc(S.me.role)}${S.me.unit?" · "+esc(S.me.unit):""}<br>${T} <a href="#" style="color:#9fb0cc" onclick="logout();return false">Sign out</a>`;
$("#app").innerHTML=`<div class="tabs">${m.map(x=>`<a class="${S.view==x[0]?"on":""}" onclick="S.view='${x[0]}';S.msg='';render()">${x[1]}</a>`).join("")}</div><main>${V[S.view]()}</main>`;if(S.view=="entry")fill()}
const V={
dash(){const O=S.O,tot=O.reduce((s,o)=>s+o.qty,0),cs=O.reduce((s,o)=>s+cum(o.id,"Sew"),0),cc=O.reduce((s,o)=>s+cum(o.id,"Chk"),0),k=(a,b)=>`<div class="k"><span>${a}</span><div>${b}</div></div>`;
return`<div class="grid">${k("Orders",O.length)}${k("PO Qty",tot)}${k("Verified sewing",cs+" ("+pct(cs,tot)+"%)")}${k("Verified checking",cc+" ("+pct(cc,tot)+"%)")}${k("Awaiting checking",cs-cc)}${k("Delayed / risk",O.filter(o=>pstat(o)[1]=="R"||dstat(o)[1]=="R").length)}${k("Completed",O.filter(o=>pstat(o)[0]=="Completed").length)}${k("Pending verification",S.E.filter(e=>e.Status=="Pending").length)}</div>
<div class="card"><h3>Orders</h3><div class="tw"><table><tr><th>TPR PO</th><th>Style</th><th>Line</th><th>Qty</th><th>Sewn %</th><th>Production</th><th>Delivery</th></tr>${O.map(o=>`<tr><td>${esc(o.tpr)}</td><td>${esc(o.style)}</td><td>${esc(o.line)}</td><td>${o.qty}</td><td><div class="bar"><i style="width:${pct(cum(o.id,"Sew"),o.qty)}%"></i></div></td><td>${bd(...pstat(o))}</td><td>${bd(...dstat(o))}</td></tr>`).join("")}</table></div><small>Only Planning-approved entries count toward these figures.</small></div>`},
orders(){const P=S.me.role=="planning";return`<div class="card"><h3>${P?"Orders & schedule":"My orders"}</h3><div class="tw"><table><tr><th>Order ID</th><th>TPR PO</th><th>Style</th><th>Line</th><th>Qty</th><th>Planned</th><th>Revised</th><th>Actual start</th><th>Target</th>${P?"<th></th>":""}</tr>${S.O.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.tpr)}</td><td>${esc(o.style)}</td><td>${esc(o.line)}</td><td>${o.qty}</td><td>${esc(o.ps)} → ${esc(o.pe)}</td><td>${esc(o.rs)} → ${esc(o.re)}</td><td>${esc(o.as)||"–"}</td><td>${esc(o.target)}</td>${P?`<td><button class="s" onclick="revise('${esc(o.id)}')">Revise</button></td>`:""}</tr>`).join("")}</table></div><small>New orders are added in the PPC Google Sheet (the planning master). Revisions keep the original planned dates and log the change.</small></div>`},
entry(){const O=S.O.filter(o=>pstat(o)[0]!="Completed"&&!o.delivered);return`<div class="card"><h3>Daily production entry</h3><div class="f"><div><label>Date</label><input id="e_d" type="date" value="${T}" max="${T}"></div><div><label>Order</label><select id="e_o" onchange="fill()">${O.map(o=>`<option value="${esc(o.id)}">${esc(o.tpr)} · ${esc(o.style)}</option>`).join("")}</select></div>
<div><label>Daily target (qty ÷ revised days)</label><input id="e_t" readonly></div><div><label>Remaining sewing balance</label><input id="e_b" readonly></div>
<div><label>Sewing output</label><input id="e_sew" type="number" min="0" inputmode="numeric"></div><div><label>Checking output</label><input id="e_chk" type="number" min="0" inputmode="numeric"></div><div><label>Rework</label><input id="e_rw" type="number" min="0" value="0"></div><div><label>Rejection</label><input id="e_rj" type="number" min="0" value="0"></div>
<div><label>Sewing WIP pending</label><input id="e_sw" type="number" min="0"></div><div><label>Checking WIP pending</label><input id="e_cw" type="number" min="0"></div><div><label>Delay reason</label><input id="e_r"></div><div><label>Remarks</label><input id="e_m"></div></div>
<div class="er" id="ee">${esc(S.msg)}</div><button onclick="sub()">Submit for verification</button></div>
<div class="card"><h3>Recent submissions</h3>${tbl(S.E.slice().sort((a,b)=>b.Date.localeCompare(a.Date)).slice(0,15),0)}</div>`},
verify(){const P=S.E.filter(e=>e.Status=="Pending");return`<div class="card"><h3>Pending verification (${P.length})</h3>${tbl(P,1)||"Nothing pending."}</div><div class="card"><h3>History</h3>${tbl(S.E.slice().sort((a,b)=>b.Date.localeCompare(a.Date)).slice(0,40),0)}</div>`},
wip(){return`<div class="card"><h3>WIP (verified entries)</h3><div class="tw"><table><tr><th>TPR PO</th><th>Style</th><th>Line</th><th>Sewn</th><th>Checked</th><th>Awaiting checking</th><th>Sew WIP</th><th>Chk WIP</th><th>Last update</th></tr>${S.O.map(o=>{const l=S.E.filter(e=>e.OrderID==o.id&&e.Status=="Approved").sort((a,b)=>b.Date.localeCompare(a.Date))[0],s=cum(o.id,"Sew"),c=cum(o.id,"Chk");return`<tr><td>${esc(o.tpr)}</td><td>${esc(o.style)}</td><td>${esc(o.line)}</td><td>${s}</td><td>${c}</td><td>${s-c}</td><td>${l?esc(l.SewWIP):"No data"}</td><td>${l?esc(l.ChkWIP):"No data"}</td><td>${l?esc(l.Date)+(diff(T,l.Date)>2?" "+bd(diff(T,l.Date)+"d old","A"):""):bd("No update","R")}</td></tr>`}).join("")}</table></div></div>`},
deliv(){return`<div class="card"><h3>Delivery monitoring</h3><div class="tw"><table><tr><th>TPR PO</th><th>Line</th><th>Revised sew end</th><th>Target</th><th>Pending sewing</th><th>Pending checking</th><th>Status</th></tr>${S.O.map(o=>`<tr><td>${esc(o.tpr)}</td><td>${esc(o.line)}</td><td>${esc(o.re)}</td><td>${o.qty-cum(o.id,"Sew")}</td><td>${o.qty-cum(o.id,"Chk")}</td><td>${bd(...dstat(o))}</td></tr>`).join("")}</table></div><small>Completed sewing is never treated as delivered.</small></div>`}};
function tbl(E,act){if(!E.length)return"";return`<div class="tw"><table><tr><th>Txn</th><th>Date</th><th>Line</th><th>Order</th><th>Sew</th><th>Chk</th><th>Rework</th><th>Rej</th><th>Status</th><th>Comment</th>${act?"<th></th>":""}</tr>${E.map(e=>`<tr><td>${esc(e.TxnID)}</td><td>${esc(e.Date)}</td><td>${esc(e.Line)}</td><td>${esc(e.OrderID)}</td><td>${e.Sew}</td><td>${e.Chk}</td><td>${e.Rework}</td><td>${e.Rej}</td><td>${bd(e.Status,SC[e.Status]||"N")}</td><td>${esc(e.Comment)}</td>${act?`<td><button class="g" onclick="ver('${esc(e.TxnID)}','Approved')">Approve</button> <button class="a" onclick="ver('${esc(e.TxnID)}','Correction')">Correct</button> <button class="r" onclick="ver('${esc(e.TxnID)}','Rejected')">Reject</button></td>`:""}</tr>`).join("")}</table></div>`}
function fill(){const o=S.O.find(x=>x.id==$("#e_o")?.value);if(!o)return;$("#e_t").value=o.rs&&o.re?Math.ceil(o.qty/Math.max(1,diff(o.re,o.rs)+1)):"";$("#e_b").value=o.qty-cum(o.id,"Sew",["Pending","Approved"])}
async function sub(){const g=i=>$("#e_"+i).value,n=i=>g(i)===""?NaN:+g(i);const b={orderId:g("o"),date:g("d"),sew:n("sew"),chk:n("chk"),rework:n("rw"),rej:n("rj"),sewWip:n("sw"),chkWip:n("cw"),reason:g("r"),remarks:g("m")};
if([b.sew,b.chk,b.sewWip,b.chkWip].some(isNaN)){$("#ee").textContent="Sewing, checking and both WIP fields are required (enter 0 if actually zero).";return}
if(!confirm("Submit this report for Planning verification?"))return;try{await call("submit",b);S.msg="";await load()}catch(e){$("#ee").textContent=e.message}}
async function ver(txn,status){const c=prompt("Comment"+(status=="Approved"?" (optional)":" (required)"),"");if(c===null||(status!="Approved"&&!c))return;try{await call("verify",{txn,status,comment:c});await load()}catch(e){alert(e.message)}}
async function revise(id){const o=S.O.find(x=>x.id==id),start=prompt("Revised sew start (YYYY-MM-DD)",o.rs);if(!start)return;const end=prompt("Revised sew end (YYYY-MM-DD)",o.re),reason=prompt("Reason (required)");if(!end||!reason)return;try{await call("revise",{orderId:id,start,end,reason});await load()}catch(e){alert(e.message)}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script></body></html>
